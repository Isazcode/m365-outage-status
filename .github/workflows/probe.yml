name: probe-cme
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.cmegroup.com/tools-information/cme-global-command-center-system-alerts.html"
          for ua in "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" "curl/8"; do
            code=$(curl -s -o page.html -w "%{http_code}" -A "$ua" -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: en-US,en;q=0.9" "$U"); echo "UA=$ua -> $code size=$(wc -c <page.html)"
          done
          python3 - <<'PY'
          s=open('page.html',errors='ignore').read()
          i=s.find('Latest Alerts'); print(s[i-200:i+4000] if i>=0 else s[:1500])
          j=s.find('Historical Alerts'); print('----HIST----'); print(s[j:j+2500] if j>=0 else 'none')
          PY
