name: Update platform status

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may run a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab
  push:
    paths:                    # re-check right away when you edit settings or a manual status
      - "manual.json"
      - "platforms.config.json"

permissions:
  contents: write
  id-token: write   # lets the job prove its identity to Entra (no secret needed)

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Microsoft 365 (runs once the Entra app is set up)
        if: ${{ env.MS_CLIENT_ID != '' }}
        env:
          MS_TENANT_ID: ${{ vars.MS_TENANT_ID || '84a28f5a-e6d4-4f5a-9b8d-92dc1aa698df' }}   # Snapper Creek Energy tenant (not secret)
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          CHECK_INTERVAL_MIN: "15"
          FORCE_WRITE: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: python scripts/update_status.py

      - name: ICE, Bloomberg, Cloud9, KRM22
        if: ${{ always() }}
        env:
          CHECK_INTERVAL_MIN: "15"
          FORCE_WRITE: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: python scripts/check_platforms.py

      - name: Commit if changed
        if: ${{ always() }}
        run: |
          git add -N platforms.json 2>/dev/null || true
          if git diff --quiet -- status.json platforms.json && [ -z "$(git status --porcelain archive 2>/dev/null)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json platforms.json archive 2>/dev/null || git add status.json platforms.json
          git commit -m "Auto status update $(TZ=America/New_York date '+%-I:%M %p ET')"
          git pull --rebase origin main || true
          git push
    env:
      MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID || 'b0702174-db7d-4817-b661-78dbfbd41f78' }}   # m365-status-bot app (not secret; sign-in uses the federated credential)
